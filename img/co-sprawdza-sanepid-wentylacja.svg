<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Co sprawdza sanepid w wentylacji: czystość kratek i kanałów, działanie nawiewu i wyciągu, filtry, klimatyzacja i dokumentacja"><title>Co sprawdza sanepid w wentylacji: czystość kratek i kanałów, działanie nawiewu i wyciągu, filtry, klimatyzacja i dokumentacja</title><rect width="960" height="560" fill="#fff"/><text x="30" y="42" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="30" dy="0">Co inspektor sanitarny ogląda w wentylacji i klimatyzacji</tspan></text><text x="30" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="30" dy="0">Zakres kontroli zależy od rodzaju obiektu — to typowe punkty, o które warto zadbać wcześniej</tspan></text><rect x="30" y="96" width="290" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><rect x="30" y="96" width="290" height="46" rx="12" fill="#0f172a"/><rect x="30" y="126" width="290" height="16" fill="#0f172a"/><text x="175.0" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="175.0" dy="0">Czystość</tspan></text><path d="M48 172 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="78" y="178" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="78" dy="0">kratki i anemostaty</tspan><tspan x="78" dy="21">bez kurzu i nalotu</tspan></text><path d="M48 224 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="78" y="230" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="78" dy="0">kanały bez osadów</tspan><tspan x="78" dy="21">i śladów pleśni</tspan></text><path d="M48 276 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="78" y="282" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="78" dy="0">okap i kanał wyciągowy</tspan><tspan x="78" dy="21">w kuchni bez tłuszczu</tspan></text><path d="M48 328 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="78" y="334" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="78" dy="0">taca skroplin klimatyzacji</tspan><tspan x="78" dy="21">czysta i drożna</tspan></text><path d="M48 380 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="78" y="386" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="78" dy="0">filtry wymieniane</tspan><tspan x="78" dy="21">zgodnie z instrukcją</tspan></text><rect x="335" y="96" width="290" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><rect x="335" y="96" width="290" height="46" rx="12" fill="#0f172a"/><rect x="335" y="126" width="290" height="16" fill="#0f172a"/><text x="480.0" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="480.0" dy="0">Działanie</tspan></text><path d="M353 172 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="383" y="178" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="383" dy="0">nawiew i wyciąg pracują</tspan><tspan x="383" dy="21">w każdym pomieszczeniu</tspan></text><path d="M353 224 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="383" y="230" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="383" dy="0">wydajność zgodna</tspan><tspan x="383" dy="21">z projektem</tspan></text><path d="M353 276 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="383" y="282" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="383" dy="0">brak przepływu powietrza</tspan><tspan x="383" dy="21">ze strefy brudnej do czystej</tspan></text><path d="M353 328 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="383" y="334" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="383" dy="0">urządzenia bez usterek</tspan><tspan x="383" dy="21">i nietypowych zapachów</tspan></text><path d="M353 380 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="383" y="386" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="383" dy="0">dostęp do otworów</tspan><tspan x="383" dy="21">rewizyjnych</tspan></text><rect x="640" y="96" width="290" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><rect x="640" y="96" width="290" height="46" rx="12" fill="#0f172a"/><rect x="640" y="126" width="290" height="16" fill="#0f172a"/><text x="785.0" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="785.0" dy="0">Dokumenty</tspan></text><path d="M658 172 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="688" y="178" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="688" dy="0">protokół z ostatniego</tspan><tspan x="688" dy="21">przeglądu</tspan></text><path d="M658 224 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="688" y="230" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="688" dy="0">protokół z czyszczenia</tspan><tspan x="688" dy="21">i dezynfekcji</tspan></text><path d="M658 276 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="688" y="282" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="688" dy="0">wyniki pomiarów</tspan><tspan x="688" dy="21">strumieni powietrza</tspan></text><path d="M658 328 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="688" y="334" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="688" dy="0">wyniki badań mikrobio-</tspan><tspan x="688" dy="21">logicznych (jeśli były)</tspan></text><path d="M658 380 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="688" y="386" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="688" dy="0">wpisy w książce</tspan><tspan x="688" dy="21">obiektu budowlanego</tspan></text><text x="30" y="520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start"><tspan x="30" dy="0">Dokumenty przechowuj w jednym segregatorze lub folderze — inspektor może poprosić o nie na początku kontroli.</tspan></text></svg>
