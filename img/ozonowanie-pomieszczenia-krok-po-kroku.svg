<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Ozonowanie pomieszczenia krok po kroku: przygotowanie, puste pomieszczenie, zabieg, rozpad ozonu, wietrzenie i powrót do użytkowania"><title>Ozonowanie pomieszczenia krok po kroku: przygotowanie, puste pomieszczenie, zabieg, rozpad ozonu, wietrzenie i powrót do użytkowania</title><rect width="960" height="520" fill="#fff"/><text x="30" y="42" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="30" dy="0">Ozonowanie pomieszczenia krok po kroku</tspan></text><text x="30" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="start"><tspan x="30" dy="0">Ozon jest szkodliwy przy wdychaniu — w trakcie zabiegu w pomieszczeniu nie może być ludzi ani zwierząt</tspan></text><rect x="30" y="96" width="290" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><rect x="30" y="96" width="290" height="46" rx="12" fill="#0f172a"/><rect x="30" y="126" width="290" height="16" fill="#0f172a"/><text x="175" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="175" dy="0">1. Przed</tspan></text><path d="M48 180 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="78" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="78" dy="0">wyjście ludzi i zwierząt</tspan></text><path d="M48 234 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="78" y="240" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="78" dy="0">wyniesienie roślin</tspan></text><path d="M48 288 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="78" y="294" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="78" dy="0">zamknięcie okien i drzwi</tspan></text><path d="M48 342 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="78" y="348" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="78" dy="0">oznaczenie wejścia</tspan></text><path d="M322 246 l14 0 m-6 -7 l7 7 l-7 7" fill="none" stroke="#475569" stroke-width="3"/><rect x="340" y="96" width="290" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><rect x="340" y="96" width="290" height="46" rx="12" fill="#0f172a"/><rect x="340" y="126" width="290" height="16" fill="#0f172a"/><text x="485" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="485" dy="0">2. W trakcie</tspan></text><path d="M358 180 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="388" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="388" dy="0">generator pracuje sam</tspan></text><path d="M358 234 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="388" y="240" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="388" dy="0">czas dobrany do kubatury</tspan></text><path d="M358 288 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="388" y="294" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="388" dy="0">drzwi zamknięte, bez wejść</tspan></text><path d="M358 342 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="388" y="348" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="388" dy="0">obsługa czeka na zewnątrz</tspan></text><path d="M632 246 l14 0 m-6 -7 l7 7 l-7 7" fill="none" stroke="#475569" stroke-width="3"/><rect x="650" y="96" width="290" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><rect x="650" y="96" width="290" height="46" rx="12" fill="#0f172a"/><rect x="650" y="126" width="290" height="16" fill="#0f172a"/><text x="795" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="795" dy="0">3. Po zabiegu</tspan></text><path d="M668 180 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="698" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="698" dy="0">odczekanie na rozpad ozonu</tspan></text><path d="M668 234 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="698" y="240" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="698" dy="0">wietrzenie pomieszczenia</tspan></text><path d="M668 288 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="698" y="294" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="698" dy="0">powrót dopiero po wietrzeniu</tspan></text><path d="M668 342 l7 7 l12 -14" fill="none" stroke="#0f766e" stroke-width="4"/><text x="698" y="348" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="698" dy="0">wpis do protokołu</tspan></text><text x="30" y="440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start"><tspan x="30" dy="0">Ozonowanie usuwa zapachy i ogranicza drobnoustroje w powietrzu i na odsłoniętych powierzchniach,</tspan><tspan x="30" dy="21">ale nie zastępuje czyszczenia: kurz i osad w kanałach trzeba najpierw usunąć mechanicznie.</tspan></text></svg>
